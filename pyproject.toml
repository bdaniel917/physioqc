[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physioqc"
version = "0.1.0"
description = "Headless CLI for real-time Signal Quality + auto-event logging on physiological signals"
authors = [
    {name = "PhysioQC Team", email = "team@physioqc.dev"},
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pyarrow>=7.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=4.0.0",
]

[project.scripts]
physioq = "physioqc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["physioqc"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88
